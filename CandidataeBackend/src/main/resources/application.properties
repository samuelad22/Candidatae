spring.application.name=candidatae

# =====================================================================
#  BASE DE DATOS (PostgreSQL)
# =====================================================================
# Sintaxis ${VARIABLE:valorPorDefecto}: si existe la variable de entorno la usa;
# si no, usa el valor tras los ":". Así cada compañero puede arrancar en local sin tocar
# este fichero, y en producción NUNCA escribimos contraseñas reales aquí (van en variables).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/candidatae}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
#  MIGRACIONES (Flyway)
# =====================================================================
# Flyway es la ÚNICA fuente del esquema. Los scripts viven en
# src/main/resources/db/migration y se numeran V1__..., V2__..., etc.
# spring.flyway.baseline-on-migrate=true permite que un desarrollador con una BD
# antigua (creada por el antiguo ddl-auto=update) migre sin perder sus datos:
# en ese caso Flyway marca el esquema como línea base y solo aplica las
# migraciones nuevas (V2__cuenta_correo.sql).
# Si prefieres un esquema limpio: docker compose down -v y recarga.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =====================================================================
#  JPA / HIBERNATE
# =====================================================================
# "validate": Hibernate comprueba que el esquema de la BD coincide con las
# entidades y FALLA si no encaja. Es el modo correcto cuando Flyway manda
# sobre el esquema (nunca "update" ni "create" con Flyway activo).
spring.jpa.hibernate.ddl-auto=validate
# Muestra en consola el SQL que genera Hibernate (útil para aprender y depurar).
# En producción conviene desactivarlo: ensucia el log y puede filtrar datos.
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
# Desactiva "Open Session In View": evita consultas a BD ocultas desde el controlador.
# Obliga a cargar los datos necesarios dentro de la capa de servicio (buena práctica).
spring.jpa.open-in-view=false
# Carga en lotes de colecciones perezosas (@OneToMany): elimina el problema de consultas N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# =====================================================================
#  JWT
# =====================================================================
# Si no se define JWT_SECRET, JwtService usa la clave temporal por defecto (solo desarrollo).
# En producción: JWT_SECRET=<cadena aleatoria de al menos 32 caracteres>
jwt.secret=${JWT_SECRET:una_clave_secreta_simulada_muy_larga_por_defecto}
# Duración del token en milisegundos (86400000 = 24 horas).
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =====================================================================
#  CORS
# =====================================================================
# Orígenes permitidos para el frontend en desarrollo.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =====================================================================
#  CIFRADO DE SECRETOS (refresh tokens de Gmail)
# =====================================================================
# Clave AES-256-GCM de 32 bytes codificada en Base64. Sirve para cifrar los
# refresh_token de Gmail antes de guardarlos en la BD (columna BYTEA).
# En producción: GMAIL_TOKEN_ENCRYPTION_KEY=<base64 de 32 bytes aleatorios>
gmail.token-encryption-key=${GMAIL_TOKEN_ENCRYPTION_KEY:WDvLnXIqcos+Md3ZRQZxYkyMPobDDWOENqV/0A6HJGs=}

# =====================================================================
#  OAUTH2 - VINCULACIÓN DE BANDEJA GMAIL (solo lectura)
# =====================================================================
# Estos valores NO son un login de Candidatae: son el consentimiento para que
# nuestra app lea el buzón del usuario (gmail.readonly). La sesión de la app
# sigue siendo JWT propia.
# Configurar en Google Cloud Console:
#   - Habilitar la API de Gmail en el proyecto.
#   - OAuth consent screen (External) y añadir los correos del equipo como test users.
#   - Credentials > OAuth Client ID > Web application, con la redirect URI de abajo.
app.gmail.client-id=${GOOGLE_CLIENT_ID:}
app.gmail.client-secret=${GOOGLE_CLIENT_SECRET:}
app.gmail.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
app.gmail.token-uri=https://oauth2.googleapis.com/token
app.gmail.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
app.gmail.revoke-uri=https://oauth2.googleapis.com/revoke
# Scopes: solo lectura del buzón + identidad de la cuenta.
app.gmail.scope=openid email profile https://www.googleapis.com/auth/gmail.readonly
# Redirect URI EXACTA que hay que registrar en Google. Se usa también para el
# intercambio del "code" por el refresh token, así que ambos usos coinciden.
app.gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8080/api/email-accounts/gmail/callback}

# =====================================================================
#  OAUTH2 - VINCULACIÓN DE BANDEJA OUTLOOK (Microsoft Entra ID)
# =====================================================================
app.outlook.client-id=${OUTLOOK_CLIENT_ID:}
app.outlook.client-secret=${OUTLOOK_CLIENT_SECRET:}
app.outlook.authorization-uri=${OUTLOOK_AUTH_URI:https://login.microsoftonline.com/common/oauth2/v2.0/authorize}
app.outlook.token-uri=${OUTLOOK_TOKEN_URI:https://login.microsoftonline.com/common/oauth2/v2.0/token}
app.outlook.user-info-uri=${OUTLOOK_USER_INFO_URI:https://graph.microsoft.com/v1.0/me}
app.outlook.messages-uri=${OUTLOOK_MESSAGES_URI:https://graph.microsoft.com/v1.0/me/mailFolders/Inbox/messages}
app.outlook.scope=${OUTLOOK_SCOPE:offline_access User.Read Mail.Read}
app.outlook.redirect-uri=${OUTLOOK_REDIRECT_URI:http://localhost:8080/api/email-accounts/outlook/callback}
app.outlook.state-ttl-seconds=${OUTLOOK_STATE_TTL_SECONDS:600}
# Duración (en segundos) del "state" de la vinculación OAuth2.
app.gmail.state-ttl-seconds=${GMAIL_STATE_TTL_SECONDS:600}
# Cookie de protección anti-CSRF de la vinculación. "secure" solo puede ser true
# si la aplicación se sirve por HTTPS (en producción, sí).
app.gmail.secure-cookie=${GMAIL_SECURE_COOKIE:false}
# URL del frontend a la que se redirige tras completar (o fallar) la vinculación.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# =====================================================================
#  OPENAPI / SWAGGER
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# =====================================================================
#  IMAP - EMAIL SYNCHRONIZATION (Gmail App Password)
# =====================================================================
app.imap.gmail.host=${GMAIL_IMAP_HOST:imap.gmail.com}
app.imap.gmail.port=${GMAIL_IMAP_PORT:993}
app.imap.gmail.protocol=${GMAIL_IMAP_PROTOCOL:imaps}
app.imap.gmail.ssl-enable=${GMAIL_IMAP_SSL_ENABLE:true}

# =====================================================================
#  IMAP - OUTLOOK SYNCHRONIZATION (Office 365 / Outlook.com)
# =====================================================================
app.imap.outlook.host=${OUTLOOK_IMAP_HOST:outlook.office365.com}
app.imap.outlook.port=${OUTLOOK_IMAP_PORT:993}
app.imap.outlook.protocol=${OUTLOOK_IMAP_PROTOCOL:imaps}
app.imap.outlook.ssl-enable=${OUTLOOK_IMAP_SSL_ENABLE:true}
app.imap.connection-timeout-ms=${IMAP_CONNECTION_TIMEOUT_MS:10000}
app.imap.read-timeout-ms=${IMAP_READ_TIMEOUT_MS:15000}
app.imap.max-messages-per-sync=${IMAP_MAX_MESSAGES:50}
app.imap.initial-days-window=${IMAP_INITIAL_DAYS_WINDOW:30}
springdoc.api-docs.path=/v3/api-docs
