spring.application.name=demo

# =====================================================================
#  BASE DE DATOS (PostgreSQL)
# =====================================================================
# Sintaxis ${VARIABLE:valorPorDefecto}: si existe la variable de entorno la usa;
# si no, usa el valor tras los ":". Así cada compañero puede arrancar en local sin tocar
# este fichero, y en producción NUNCA escribimos contraseñas reales aquí (van en variables).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/candidatae}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
#  JPA / HIBERNATE
# =====================================================================
# update: al arrancar, Hibernate compara las @Entity con las tablas y crea/añade lo que falte.
# Cómodo en desarrollo, pero NO borra columnas ni migra datos. En producción se recomienda
# "validate" + una herramienta de migraciones (Flyway / Liquibase).
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate (útil para aprender y depurar).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desactiva "Open Session In View": evita consultas a BD ocultas desde el controlador.
# Obliga a cargar los datos necesarios dentro de la capa de servicio (buena práctica).
spring.jpa.open-in-view=false

# =====================================================================
#  JWT
# =====================================================================
# Si no se define JWT_SECRET, JwtService usa la clave temporal por defecto (solo desarrollo).
# En producción: JWT_SECRET=<cadena aleatoria de al menos 32 caracteres>
jwt.secret=${JWT_SECRET:una_clave_secreta_simulada_muy_larga_por_defecto}
# Duración del token en milisegundos (86400000 = 24 horas).
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
